{# Version selector (bottom left): version_switcher.js fills it from /versions.json #}
<div class="rst-versions" data-toggle="rst-versions" role="note" aria-label="Versions" id="easynav-versions" style="display: none;">
  <span class="rst-current-version" data-toggle="rst-current-version">
    <span class="fa fa-book"> EasyNav</span>
    v: <span id="easynav-current-version"></span>
    <span class="fa fa-caret-down"></span>
  </span>
  <div class="rst-other-versions">
    <dl id="easynav-version-list">
      <dt>Versions</dt>
    </dl>
  </div>
</div>
<script src="{{ pathto('_static/version_switcher.js', 1) }}"></script>
