# TIAGo in the lab (lab_nov_2026 map): costmap stack with the MPPI controller.

launch:
- arg:
    name: params_file
    default: $(find-pkg-share easynav_indoor_testcase)/robots_params/tiago.costmap.mppi.params.yaml
    description: EasyNav ROS 2 parameters file
- arg:
    name: odom_topic
    default: /direct_laser_odometry/odom
    description: Odometry topic AMCL reads (PAL's laser odometry)

- include:
    file: $(find-pkg-share easynav_indoor_testcase)/launch/easynav_tiago.launch.yaml
    arg:
    - {name: params_file, value: $(var params_file)}
    - {name: odom_topic, value: $(var odom_topic)}
