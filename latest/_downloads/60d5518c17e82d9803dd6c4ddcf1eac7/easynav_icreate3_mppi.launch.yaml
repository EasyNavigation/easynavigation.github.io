# iCreate3 at home (casa map): costmap stack with the MPPI controller.

launch:
- arg:
    name: params_file
    default: $(find-pkg-share easynav_indoor_testcase)/robots_params/icreate3.costmap.mppi.params.yaml
    description: EasyNav ROS 2 parameters file
- arg: {name: lidar, default: 'true', description: Start the RPLIDAR S2 driver}
- arg: {name: serial_port, default: /dev/ttyUSB0, description: RPLIDAR serial port}

- include:
    file: $(find-pkg-share easynav_indoor_testcase)/launch/easynav_icreate3.launch.yaml
    arg:
    - {name: params_file, value: $(var params_file)}
    - {name: lidar, value: $(var lidar)}
    - {name: serial_port, value: $(var serial_port)}
